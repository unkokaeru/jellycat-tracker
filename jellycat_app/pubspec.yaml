name: jellycat_app
description: A Flutter app for tracking Jellycat plushie collections

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Database & Local Storage
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # JSON & Data Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  
  # UI & Design
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Logging
  logger: ^2.3.0
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  
  # Linting
  flutter_lints: ^4.0.0
  
  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  
  # Add fonts and assets here
  # assets:
  #   - assets/images/
  
  # fonts:
  #   - family: JellycatFont
  #     fonts:
  #       - asset: fonts/font.ttf
